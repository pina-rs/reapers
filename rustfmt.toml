# The workspace's formatting: pina's style, which the program and its
# generated client are written in. Needs the pinned nightly's rustfmt.
edition = "2024"
style_edition = "2024"
unstable_features = true
condense_wildcard_suffixes = true
force_multiline_blocks = true
format_code_in_doc_comments = false
format_macro_matchers = true
format_strings = false
group_imports = "StdExternalCrate"
hard_tabs = true
imports_granularity = "Item"
imports_layout = "HorizontalVertical"
indent_style = "Block"
max_width = 100
newline_style = "Unix"
normalize_comments = true
reorder_impl_items = true
reorder_imports = true
reorder_modules = true
use_field_init_shorthand = true
wrap_comments = false
# Written by leptoskit for the app's native runners.
ignore = ["crates/reapers_app/android/src/lib.rs", "crates/reapers_app/ios/src/lib.rs"]
