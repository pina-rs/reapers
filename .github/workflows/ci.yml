name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up the pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      # Flutter's Linux toolchain, and the native build tools the asset hooks
      # reach for while a test bundle is compiled.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Resolve the workspace
        run: flutter pub get

      # The server tests start an embedded PostgreSQL. It needs a passwords
      # file, and the committed example holds local placeholders only.
      - name: Create the local server passwords
        run: >-
          cp reapers_server/config/passwords.example.yaml
          reapers_server/config/passwords.yaml

      - name: Run every check
        run: dart tool/check.dart
