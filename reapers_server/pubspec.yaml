name: reapers_server
description: Reapers backend. Keeps each player's books and judges every request with the shared rules.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.3

resolution: workspace

dependencies:
  cryptography: ^2.9.0
  reapers_shared:
    path: ../reapers_shared
  serverpod: 4.0.3
  serverpod_auth_idp_server: 4.0.3
  solana_kit: ^0.10.0
  solana_kit_rpc_api: ^0.10.0
  solana_kit_mpl_core: ^0.10.0
  http: ^1.6.0

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  serverpod_test: 4.0.3
  test: ^1.25.5

serverpod:
  # The game `serverpod start` can launch alongside the server.
  flutter_apps:
    reapers:
      path: ../reapers_flutter
      displayName: "Reapers"
      auto_launch: false
      target: lib/main.dart
      dart-define:
        REAPERS_SERVER_URL=http://localhost:8080/
    demo:
      path: ../reapers_flutter
      displayName: "Reapers demo circle"
      auto_launch: false
      target: lib/main.dart
      dart-define:
        REAPERS_SERVER_URL=http://localhost:8080/
        REAPERS_DEMO_RIFT=true
    studio:
      path: ../reapers_flutter
      displayName: "Reaper studio"
      auto_launch: false
      target: lib/main_preview.dart
