# Example passwords file for local development and tests.
#
# `config/passwords.yaml` is git-ignored and is never committed. Copy this
# file to create it:
#
#     cp config/passwords.example.yaml config/passwords.yaml
#
# The values below are local placeholders. The embedded PostgreSQL that
# `dart test` and `serverpod start` launch is created with whatever password
# this file supplies, and nothing here reaches a deployed environment.
#
# A deployed server ignores this file: Serverpod reads
# `SERVERPOD_PASSWORD_<name>` from the environment, and `lib/server.dart`
# refuses to start in staging or production without the real secrets.

# Values shared by every run mode.
shared:
  # Placeholder for the embedded database. Any value works locally.
  database: "local-development-only"

development:
  # The service secret used between servers and for Insights.
  serviceSecret: "local-development-only"
  jwtHmacSha512PrivateKey: "local-development-only"
  jwtRefreshTokenHashPepper: "local-development-only"

# The test run mode is what `dart test` uses.
test:
  database: "local-development-only"
  jwtHmacSha512PrivateKey: "local-development-only"
  jwtRefreshTokenHashPepper: "local-development-only"
