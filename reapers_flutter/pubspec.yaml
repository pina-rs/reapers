name: reapers_flutter
description: Reapers, an AR game where you hunt dead NFTs that haunt the spirit realm.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # The hunt draws the spirit realm over the live camera feed.
  camera: ^0.12.0
  flutter_hooks: ^0.21.3+1
  # Every 3D surface, from the reaper in the sanctum to the husks in a hunt.
  flutter_scene: ^0.23.0
  # `hooks` is the native build-hook package that hook/build.dart depends on.
  # It is unrelated to `flutter_hooks`.
  hooks: ^2.0.2
  hooks_riverpod: ^3.4.3
  reapers_client:
    path: ../reapers_client
  reapers_shared:
    path: ../reapers_shared
  riverpod_annotation: ^4.0.7
  # Gyroscope and accelerometer: where the phone points, and how it swings.
  sensors_plus: ^7.1.0
  serverpod_auth_idp_flutter: 4.0.3
  serverpod_flutter: 4.0.3
  shared_preferences: ^2.5.5
  vector_math: ^2.4.2
  flutter_onnxruntime: ^1.8.5
  flutter_soloud: ^4.1.7
  geolocator: ^14.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  build_runner: ^2.4.13
  camera_platform_interface: ^2.14.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  # Localization is generated from lib/l10n/*.arb through l10n.yaml; run
  # `flutter gen-l10n` after editing a translation file.
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/Fraunces-LICENSE.txt
    - assets/fonts/DMSans-LICENSE.txt
    # The depth model that reads the room; built by tool/build_depth_model.dart.
    - assets/depth/
    - assets/materials/
    - assets/models/
    # Recordings made by other people and released for anyone to use; built
    # by tool/build_music.dart and credited in assets/music/CREDITS.md.
    - assets/music/
    - assets/nfts/
    - assets/branding/
    - flutter_scene_generated/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  background_color_ios: '#07080B'
  adaptive_icon_background: '#07080B'
  adaptive_icon_foreground: assets/branding/adaptive_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/adaptive_monochrome.png

flutter_native_splash:
  fullscreen: true
  android_screen_orientation: portrait
  android: true
  ios: true
  web: false
  color: '#07080B'
  color_dark: '#07080B'
  image: assets/branding/splash_mark.png
  image_dark: assets/branding/splash_mark.png
  android_12:
    color: '#07080B'
    color_dark: '#07080B'
    image: assets/branding/splash_mark.png
    image_dark: assets/branding/splash_mark.png
