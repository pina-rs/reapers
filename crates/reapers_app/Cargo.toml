[package]
name = "reapers_app"
description = "The Reapers game on leptoskit: one tree of screens for the browser and the iOS and Android apps' Wasm guest."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library is the app for every host: the browser's Wasm client and the
# native apps' Wasm guest. `leptoskit dev` and `leptoskit build` choose its
# features per platform.
[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The browser: the leptos web renderer, `fetch`, `localStorage` and the
# address bar.
web = [
	"dep:leptos",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
	"dep:js-sys",
	"dep:console_error_panic_hook",
	"leptoskit/web",
	"leptoskit_l10n/web",
	"leptoskit_plugin_audio/browser",
	"leptoskit_router/web",
	"leptoskit_plugin_crypto/web",
	"leptoskit_plugin_http/browser",
	"reapers_api/web",
	"dep:leptoskit_xr",
	"leptoskit_xr/web",
]
csr = ["web", "leptos/csr"]
# A native app's Wasm guest: the store, HTTP, linking and audio plugins, and
# an executor the app keeps itself.
native = [
	"leptoskit/guest",
	"leptoskit_plugin_audio/guest",
	"leptoskit_plugin_crypto/guest",
	"reapers_api/guest",
	"dep:leptoskit_plugin_haptics",
	"leptoskit_plugin_haptics/guest",
	"leptoskit_plugin_http/guest",
	"dep:leptoskit_plugin_linking",
	"leptoskit_plugin_linking/guest",
	"dep:leptoskit_plugin_secure_store",
	"leptoskit_plugin_secure_store/guest",
	"leptoskit_plugin_store/guest",
	"dep:leptoskit_xr",
	"leptoskit_xr/guest",
	"dep:leptoskit_plugin_permissions",
	"leptoskit_plugin_permissions/guest",
]
ios = ["native", "leptoskit/ios"]
# Android adds Mobile Wallet Adapter, which only Android wallets speak.
android = [
	"native",
	"leptoskit/android",
	"dep:leptoskit_bridge",
	"dep:solana_kit_leptoskit",
	"dep:solana_kit_wallet",
	"solana_kit_leptoskit/wallet-session",
]
# The DevTools agents; `leptoskit dev` turns this on, `leptoskit build` never does.
devtools = ["leptoskit/devtools"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
leptoskit = { workspace = true, features = ["3d"] }
leptoskit_l10n = { workspace = true }
# The music: Web Audio in the browser, the host's engine in a native app.
leptoskit_plugin_audio = { workspace = true }
leptoskit_plugin_crypto = { workspace = true }
leptoskit_router = { workspace = true }
reactive_graph = "0.3.0-rc0"
reapers_api = { workspace = true }
reapers_program_client = { workspace = true }
reapers_receipt = { workspace = true }
reapers_rules = { workspace = true }
reapers_world = { workspace = true }
# The platform's AR: its frames, touches and planes, and hit tests against
# its depth. `web` and `native` choose the browser's WebXR or the host's.
leptoskit_xr = { version = "=0.3.0", optional = true }
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana_kit_core = { workspace = true }
solana_kit_leptoskit = { workspace = true, optional = true }
solana_kit_memo = { workspace = true }
solana_kit_wallet = { workspace = true, optional = true, features = ["mwa"] }
leptoskit_bridge = { workspace = true, optional = true, features = ["guest"] }
solana_kit_system = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }
num-traits = { workspace = true }
thiserror = "2"

# The browser renderer and its glue.
leptos = { version = "0.9.0-rc0", default-features = false, optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# The embedded wasm-bindgen CLI accepts exactly its matching library version.
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Navigator", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Location", "Crypto", "MediaQueryList", "console", "CustomEvent", "CustomEventInit", "Event", "EventTarget", "Document", "Element", "DomRect", "PointerEvent", "MouseEvent"] }

# What only a browser or a native guest calls: the device's store, HTTP,
# links and haptics. The browser reaches the last two through `web-sys`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit_plugin_haptics = { workspace = true, optional = true }
leptoskit_plugin_http = { workspace = true, default-features = false }
leptoskit_plugin_linking = { workspace = true, optional = true }
leptoskit_plugin_secure_store = { workspace = true, optional = true }
leptoskit_plugin_store = { workspace = true }
# The camera, asked for before a phone's AR starts.
leptoskit_plugin_permissions = { version = "=0.3.0", optional = true, default-features = false }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
leptoskit_testing = { workspace = true }

# The end-to-end test (`tests/devnet.rs`): the desktop's HTTP for the
# game's client, and a runtime for it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The headless render of a reaper (`tests/render.rs`).
leptoskit_3d = { version = "=0.3.0", features = ["renderer"] }
leptoskit_plugin_websocket = { workspace = true, features = ["async-host"] }
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[build-dependencies]
leptoskit_build = { workspace = true }
serde_json = "1"

[lints]
workspace = true
