<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The router matches the path after the base, and files load relative
         to it, so the same page serves from any path. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#342f33" />
    <link rel="icon" href="assets/branding/mark.webp" type="image/webp" />
    <title>Reapers</title>
    <!-- The three faces load before the first frame, so nothing is set
         twice: Display, Text and Figures (assets/app.css). -->
    <link rel="preload" href="assets/fonts/Skribble-Black-Latin.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="assets/fonts/SkribbleNotoSketch-Latin.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="assets/fonts/SkribbleMonoGentle-Bold-Latin.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="assets/app.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body></body>
</html>
