#:schema https://leptoskit.dev/schemas/leptoskit.v0.schema.json

schema_version = 0

# Reapers: the browser through `leptoskit dev`, and the iOS and Android apps
# through `leptoskit build --platform ios|android`, and Meta Quest through
# `leptoskit build --platform quest`, as a panel (see [native.quest]). The
# server is its own crate, `reapers_server`, so this project builds no
# backend of its own.
[app]
name = "reapers"
version = "0.1.0"
default_platform = "web"
platforms = ["web", "ios", "android", "quest"]
render = "csr"
# The launcher icon on every platform, from the Bound Sigil (docs/branding.md):
# leptoskit makes the iOS set and Android's densities and adaptive icon from it.
icon = "../../assets/branding/app_icon.png"

# The launch screen: the mark's still on the veil's ink, framed for
# Android 12's safe circle (docs/branding.md).
[app.launch_screen]
background = "#07080b"
image = "../../assets/branding/splash_mark.png"

# Agents and people alike write builder calls here: the compiler checks them
# directly, and there is no markup to keep in step.
[lint]
markup = "builder"

[lint.rules]
markup_style = "deny"
component_attribute = "deny"

[build]
backend = false
client_package = "reapers_app"

[serve]
address = "127.0.0.1"
port = 3010

[bundle]
optimize = "fast"
wasm_opt = true
precompress = false

[native]
# XR frames now identify measured and inferred depth. The native host and
# its guest must update together; an older host has only the boolean wire format.
update_contract = "mobile-v2"
package_id = "com.reapers.app"
viewport_width = 390.0
viewport_height = 844.0
# The save (store), the server session's refresh token (secure-store), the
# server and the cluster's RPC (http), the rifts' live socket (websocket),
# the fresh seeds and burner keys (crypto), the marketplace and the
# explorer (linking), a click under the thumb (haptics), Mobile Wallet
# Adapter on Android (solana-wallet), the music (audio), the room around the
# player (xr: ARKit, ARCore, OpenXR on Quest, or the rotation sensor) and the
# camera's permission it needs (permissions).
plugins = ["store", "secure-store", "http", "websocket", "crypto", "linking", "haptics", "solana-wallet", "audio", "xr", "permissions"]

# The rifts' live socket starts with the native host, including offline
# builds. Its factory requires explicit keeper origins. A deployed keeper
# needs its matching ws:// or wss:// origin here, as well as HTTP below.
[native.plugin-options.websocket]
origins = [
    "ws://127.0.0.1:8080",
    "ws://localhost:8080",
    "ws://10.0.2.2:8080",
]

# The hunt reads the platform's frames at the rules' own rate: more would
# only be skipped.
[native.plugin-options.xr]
max-frame-rate = 30
# Phones without platform depth (the Seeker, ARCore phones without the
# Depth API, iPhones without LiDAR) read the room from the camera's picture
# with this model, under the app's assets/. `cargo xtask fetch-depth-model`
# puts it there; without it those phones read no room.
depth-model = "depth/depth_anything_v2_metric_indoor_small.onnx"

# On a Quest the game opens as a panel in the player's space: its screens are
# ordinary leptoskit views, which an immersive session would not show. The
# hunt's AR then follows the headset through OpenXR where it can; drawing it
# into the headset's own frames is left to leptoskit_xr's 3D glue (see
# docs/environment.md).
[native.quest]
immersive = false
hand-tracking = "optional"
passthrough = true

# The HTTP plugin only talks to these origins: a development server and a
# local Surfpool on this machine, the Android emulator's alias for it, and
# devnet's public RPC for a REAPERS_CLUSTER=devnet build. A build for a
# deployed server adds its origin here and sets REAPERS_SERVER_URL when it
# builds; one with its own RPC adds that.
[native.plugin-options.http]
origins = [
	"http://127.0.0.1:8080",
	"http://localhost:8080",
	"http://10.0.2.2:8080",
	"http://127.0.0.1:8899",
	"http://localhost:8899",
	"http://10.0.2.2:8899",
	"https://api.devnet.solana.com",
]

# Screens are files under src/routes; `leptoskit build` writes src/routes.rs.
[[plugins]]
name = "router"

# Every string a player reads is in locales/en.arb; `leptoskit build`
# writes src/l10n.rs from it.
[l10n]
dir = "locales"
output = "src/l10n.rs"
template = "en"
