[package]
name = "reapers_api"
description = "The contract between the Reapers game and its keeper: every request, every answer, and the operations that carry them."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Operations' argument structs build on every target. Default features off:
# the app picks how it reaches the keeper (`web`, `guest`) and the server
# turns on the bodies (`server`).
base64 = { workspace = true, features = ["alloc"] }
futures = { workspace = true, features = ["alloc"] }
leptoskit_rpc = { workspace = true }
reapers_rules = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }


[features]
default = []
# Calls from the browser.
web = ["leptoskit_rpc/web"]
# Calls from a native app's Wasm guest.
guest = ["leptoskit_rpc/guest"]
# The keeper: operations' bodies, on Postgres, with live streams.
#
# Cargo unifies `leptoskit_rpc`'s features across every crate in a build, so
# `#[rpc::query]` and `#[rpc::mutation]` keep their bodies, and with them the
# `keeper` this crate's gates name, whenever *any* crate in the build turns on
# `leptoskit_rpc/postgres`. Every such crate must turn this feature on too, or
# the bodies compile without the keeper they call; `reapers_db` says why it
# does. `web` and `guest` never do.
server = ["leptoskit_rpc/postgres", "leptoskit_rpc/live"]

[lints]
workspace = true
