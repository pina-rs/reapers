[package]
name = "reapers_landing"
description = "The Reapers landing page: a static web frontend on leptoskit, beside the game."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library is the page: the browser's Wasm client. `leptoskit build`
# turns on `csr` for it; the page is never built for a native host.
[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The browser: the leptos web renderer and its glue.
web = [
	"dep:leptos",
	"dep:wasm-bindgen",
	"dep:console_error_panic_hook",
	"leptoskit/web",
	"leptoskit_l10n/web",
	"leptoskit_router/web",
]
csr = ["web", "leptos/csr"]
# The DevTools agents; `leptoskit dev` turns this on, `leptoskit build` never does.
devtools = ["leptoskit/devtools"]

[dependencies]
leptoskit = { workspace = true }
leptoskit_l10n = { workspace = true }
leptoskit_router = { workspace = true }
reactive_graph = "0.3.0-rc0"

# The browser renderer and its glue.
leptos = { version = "0.9.0-rc0", default-features = false, optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# The embedded wasm-bindgen CLI accepts exactly its matching library version.
wasm-bindgen = { version = "=0.2.129", optional = true }

[dev-dependencies]
leptoskit_testing = { workspace = true }
reapers_rules = { workspace = true }

[build-dependencies]
leptoskit_build = { workspace = true }

[lints]
workspace = true
