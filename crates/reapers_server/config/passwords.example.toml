# Example secrets file for local development and tests.
#
# `config/passwords.toml` is git-ignored and is never committed. Copy this
# file to create it:
#
#     cp config/passwords.example.toml config/passwords.toml
#
# The values below are local placeholders. A keeper reads this file only in
# the development and test run modes. A deployed keeper ignores it: it reads
# `REAPERS_SECRET_<name>` from the environment, and refuses to start in
# staging or production without every one of `database`, `authKeys` and
# `receiptSigningKey`.

# Values shared by every run mode.
[shared]
# The PostgreSQL the keeper keeps its books in. See readme.md for setting
# one up.
database = "postgres://localhost:5432/reapers?sslmode=disable"

[development]
# Sign-in's keys: `id:key`, where the key is 32 bytes of base64url. Leave it
# out and a development keeper derives one from a public name. A deployed
# keeper needs a real one, such as
#   "$(date +%Y-%m):$(openssl rand 32 | basenc --base64url | tr -d =)"
# authKeys = "2026-11:..."

# Absorption receipts are signed with a key derived from `receiptSigningKey`.
# Development and tests leave it unset and sign with a key anyone can derive,
# so their receipts prove nothing. A deployed keeper refuses to start without
# a real one: set REAPERS_SECRET_receiptSigningKey to a long random value and
# keep it as carefully as the database password. Its public half is the
# keeper the Reapers program trusts.
# receiptSigningKey = "..."

[test]
database = "postgres://localhost:5432/reapers_test?sslmode=disable"
