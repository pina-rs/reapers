[package]
name = "reapers_server"
description = "The Reapers keeper: player books, hunt replays, rifts, wallets and NFT reapers, on leptoskit and PostgreSQL."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock", "std"] }
futures = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
leptoskit_auth = { workspace = true, features = ["axum", "postgres", "rpc"] }
leptoskit_axum = { workspace = true }
leptoskit_db = { workspace = true, features = ["postgres"] }
leptoskit_rpc = { workspace = true, features = ["postgres", "live"] }
reapers_api = { workspace = true, features = ["server"] }
reapers_db = { workspace = true }
reapers_program_client = { workspace = true }
reapers_receipt = { workspace = true }
reapers_rules = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana_kit_client = { workspace = true }
solana_kit_core = { workspace = true, features = ["crypto"] }
solana_kit_mpl_core = { workspace = true }
solana_kit_native = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
url = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
