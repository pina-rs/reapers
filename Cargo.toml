[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/pina-rs/reapers"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
reapers_receipt = { path = "crates/reapers_receipt" }
reapers_rules = { path = "crates/reapers_rules" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

# The on-chain program: as small as it can be made.
[profile.release.package.reapers_program]
opt-level = "z"
