[workspace]
# The app's native runners sit inside its leptoskit project, as `leptoskit
# new` lays them out, and build only after `leptoskit build` has generated
# their registrants under `crates/reapers_app/.leptoskit/`.
members = ["crates/*", "crates/reapers_app/android", "crates/reapers_app/ios"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/pina-rs/reapers"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
reapers_api = { path = "crates/reapers_api", default-features = false }
reapers_db = { path = "crates/reapers_db" }
reapers_receipt = { path = "crates/reapers_receipt" }
reapers_rules = { path = "crates/reapers_rules" }
reapers_world = { path = "crates/reapers_world" }

# The on-chain program and its tests.
bs58 = "0.5.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
sha2 = "0.10.9"
pina = { version = "0.24.0", default-features = false }
reapers_program_client = { path = "crates/reapers_program_client" }

# The deploy and rehearsal tool. Solana Kit's crates on crates.io are name
# reservations, so they come from git, pinned to one revision.
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
serde_json = "1"
solana_kit_client = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }
solana_kit_core = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7", features = ["crypto"] }
solana_kit_mpl_core = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }
solana_kit_native = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }
solana_kit_surfpool = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

# The program's generated Rust client.
num-derive = "0.5"
num-traits = "0.2.19"
solana-program-error = "3"
thiserror = "2"
mollusk-svm = { version = "0.17.1", features = ["precompiles"] }
mollusk-svm-programs-token = "0.17.1"
solana-account = "5"
solana-instruction = "4"
solana-instruction-error = "3"
solana-pubkey = { version = "4.1", features = ["curve25519"] }

# leptoskit's server crates. Named at their crates.io version so that every
# crate in the graph asks for the same one, and taken from git by the patch
# below, so `solana_kit_leptoskit`'s `=0.3.0` resolves to the same source.
leptoskit_auth = { version = "0.3.0", default-features = false }
leptoskit_axum = { version = "0.3.0", default-features = false }
leptoskit_db = { version = "0.3.0", default-features = false }
leptoskit_db_schema = { version = "0.3.0", default-features = false }
leptoskit_rpc = { version = "0.3.0", default-features = false }

# Solana Kit. Its crates.io releases are still empty name reservations
# (0.0.0), so the SDK comes from git, pinned.

axum = "0.8"
base64 = { version = "0.22", default-features = false }
chrono = { version = "0.4", default-features = false }
futures = { version = "0.3", default-features = false }
http = "1"
schemars = "1.2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
toml = "0.9"
tower = "0.5"
url = "2"

# leptoskit comes from git at one revision, and every crate of it is patched
# in by name below, so the app and `solana_kit_leptoskit` (which asks for the
# published `=0.3.0`) resolve to the very same crates.
leptoskit = { version = "=0.3.0", default-features = false }
leptoskit_bridge = { version = "=0.3.0" }
leptoskit_build = { version = "=0.3.0", default-features = false }
leptoskit_l10n = { version = "=0.3.0" }
# The engine for native hosts and Web Audio for the browser are each turned
# on where they run: the app's own build needs only the types.
leptoskit_plugin_audio = { version = "=0.3.0", default-features = false }
leptoskit_plugin_crypto = { version = "=0.3.0" }
leptoskit_plugin_haptics = { version = "=0.3.0" }
# Without its default `browser` feature: the app asks for `browser` or
# `guest` per platform, and Solana's platform-tools cargo, which builds the
# program inside this workspace, refuses a member that turns off defaults the
# workspace left on.
leptoskit_plugin_http = { version = "=0.3.0", default-features = false }
leptoskit_plugin_linking = { version = "=0.3.0" }
leptoskit_plugin_secure_store = { version = "=0.3.0" }
leptoskit_plugin_websocket = { version = "=0.3.0", default-features = false }
leptoskit_plugin_store = { version = "=0.3.0" }
leptoskit_router = { version = "=0.3.0" }
leptoskit_testing = { version = "=0.3.0" }

# Solana Kit, at the revision that depends on leptoskit 0.3.0.
solana_kit_leptoskit = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }
solana_kit_memo = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }
solana_kit_system = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }
solana_kit_wallet = { git = "https://github.com/pina-rs/solana_kit", rev = "17912ee644d2898c9de3ecded026274ada8761e7" }

[workspace.lints.rust]
unsafe_code = "deny"
# The on-chain program is also compiled for `target_os = "solana"`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

# The on-chain program. Measured with `cargo build-sbf --lto` and the Mollusk
# suite: opt-level 2 is both the smallest binary (48,232 bytes, against 50,824
# for "z", 54,752 for "s" and 50,088 for 3) and within 2% of opt-level 3's
# compute units, where "z" costs about 15% more. See docs/program.md.
[profile.release.package.reapers_program]
opt-level = 2

# The depth model's runtime, which the xr plugin runs on phones without
# platform depth: unoptimised, one picture takes about 19 s instead of half a
# second, so a debug build of the app optimises it as a release would.
[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

# Every leptoskit crate in the graph, from the one revision.
